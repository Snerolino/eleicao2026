name: Verify Cloudflare token

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq (for nicer output)
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Verify Cloudflare token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ACCOUNT_ID}" ]; then
            echo "Required secrets CLOUDFLARE_API_TOKEN and CF_ACCOUNT_ID are not set. Aborting."
            exit 1
          fi
          echo "Verificando token para account ${CF_ACCOUNT_ID}..."
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/tokens/verify" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" | jq .