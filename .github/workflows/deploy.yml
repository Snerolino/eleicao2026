name: Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Data check
        run: npm run data:check

      - name: Environment preflight
        run: npm run env:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test -- --passWithNoTests

      - name: Build fallback artifact
        run: npm run build

      - name: Install smoke browser
        run: npx playwright install chromium

      - name: Local browser smoke
        run: npm run smoke:local

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:deploy

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=portal-transparencia-rs --branch=main

      - name: Install smoke browser
        run: npx playwright install chromium

      - name: Production browser smoke
        env:
          SMOKE_URL: https://portal-transparencia-rs.pages.dev/
        run: npm run smoke:preview

      - name: Production health check
        env:
          HEALTH_URL: https://portal-transparencia-rs.pages.dev/
        run: npm run health:preview
