name: Deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Data check
        run: npm run data:check

      - name: Environment preflight
        run: npm run env:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test -- --passWithNoTests

      - name: Build fallback artifact
        run: npm run build

      - name: Configure smoke browser
        run: |
          BROWSER_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER_PATH" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi

      - name: Local browser smoke
        run: npm run smoke:local

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:deploy

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=portal-transparencia-rs --branch=main

      - name: Configure smoke browser
        run: |
          BROWSER_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER_PATH" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi

      - name: Deployment browser smoke
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run smoke:preview

      - name: Deployment health check
        env:
          HEALTH_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run health:preview
