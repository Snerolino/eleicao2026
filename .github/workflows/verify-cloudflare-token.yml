name: Verify Cloudflare token

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo -S -p '' apt-get install -y jq
      - name: Verify Cloudflare token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ACCOUNT_ID}" ]; then
            echo "Required secrets CLOUDFLARE_API_TOKEN and CF_ACCOUNT_ID are not set."; exit 1
          fi
          echo "Verificando token para account ${CF_ACCOUNT_ID}..."
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/tokens/verify" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" | jq .
          echo "--- Testando acesso a Pages ---"
          curl -s -o /dev/null -w "Pages list HTTP %{http_code}\n" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects?per_page=1" \
            -H "Authorization: Bearer ${CF_API_TOKEN}"
