# Backup de deploy Cloudflare Pages.
# Salvaguarda mútua: dispara SÓ SE o workflow "Deploy" (primário) falhar,
# ou manualmente via workflow_dispatch. Usa wrangler-action (mesmo caminho
# que funciona no Deploy), evitando corrida no push.
name: Deploy to Cloudflare Pages (backup)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'failure'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm run build:deploy

      - name: Deploy to Cloudflare Pages (backup)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=portal-transparencia-rs --branch=main
