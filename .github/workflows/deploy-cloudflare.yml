# Backup de deploy Cloudflare Pages.
# Salvaguarda mútua: dispara SÓ SE o workflow "Deploy" (primário) falhar,
# ou manualmente via workflow_dispatch. Usa wrangler-action (mesmo caminho
# que funciona no Deploy), evitando corrida no push.
name: Deploy to Cloudflare Pages (backup)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'failure'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm run build:deploy

      - name: Deploy to Cloudflare Pages (backup)
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=portal-transparencia-rs --branch=main

      - name: Configure smoke browser
        run: |
          BROWSER_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_PATH" ]; then
            echo "Nenhum navegador compatível encontrado" >&2
            exit 1
          fi
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"

      - name: Deployment browser smoke
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run smoke:preview

      - name: Deployment health check
        env:
          HEALTH_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run health:preview
