<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Portal Transparência Eleitoral RS</title>
  <style>
    body {
      margin: 0;
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: #F5F6F1;
      color: #1C2321;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.75rem;
      margin: 0.5rem 0;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #4A5350;
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      background: #2B4C3F;
      color: #fff;
      padding: 0.625rem 1.25rem;
      border-radius: 2px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="mono" style="font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: #8A8A83;">
      Sem conexão
    </p>
    <h1>Você está offline</h1>
    <p>
      O conteúdo visitado recentemente pode estar disponível no cache do navegador.
      Conecte-se à internet para acessar a versão mais atualizada.
    </p>
    <a href="/" class="btn">Tentar novamente</a>
  </div>
</body>
</html>
