version: 1
project: eleicao2026
control_plane: hermes

policy:
  single_writer_per_worktree: true
  continuous_progress: true
  idle_between_gates: false
  prompt_wait_policy: never_wait_between_gates
  public_data_reconnaissance_parallel: true
  scouts_are_read_only: true
  remote_mutation_requires_human: true
  max_failures_same_executor: 2
  context_strategy: task_packet_plus_files
  never_forward_full_conversation: true
  free_models_data_class: public_repo_only
  authorization_scope: current_user_arc_covers_github_supabase_cloudflare
  end_of_turn_policy: never_idle_between_eligible_chunks
  gate_close_action: record_start_next_chunk_immediately
  blocker_scope: affected_item_only
  publish_after_green_gates: true
  durable_scheduler: hermes_cron
  durable_scheduler_job: eleicao2026-continuous-progress
  durable_scheduler_interval: 15m
  writer_lock: .orchestrator/runtime/locks/continuous-progress.lock
  lane_policy: reconnaissance_always_on_plus_independent_progress
  reconnaissance_never_blocks_local_work: true
  remote_apply_requires_exact_gate: true

lanes:
  official_reconnaissance:
    state: persistent
    authority: read-only
    executors: [public_data_scout_pool, opencode_free_pool, google_antigravity, codex_exec_fallback]
    output: manifest_hash_handoff
  local_implementation:
    state: continuous
    authority: workspace_write
    writer: hermes_single_writer
    prerequisites: [relevant_contracts_read, bounded_lock]
  publication_verification:
    state: automatic_after_green_gates
    actions: [commit, push, ci_quality, cloudflare_backup, production_http, release_sha]
  remote_factual_apply:
    state: gated
    prerequisites: [r0_identity, schema_fk, official_source, dry_run, idempotency]
    forbidden: [impact_matrix, editorial_score, approval_rpc]

executors:
  opencode_free:
    transport: cli
    wrapper: scripts/orchestrator/run-opencode.sh
    model: opencode/deepseek-v4-flash-free
    authority: read-only
    best_for:
      - cheap_analysis
      - grep_and_inventory
      - simple_review
      - log_summary
      - second_opinion
    forbidden_data:
      - secrets
      - env_files
      - service_role
      - raw_documents
      - pii

  opencode_free_pool:
    transport: cli
    wrapper: scripts/orchestrator/run-free-pool.sh
    authority: read-only
    data_class: public_repo_snapshot_only
    strategy: sequential_failover
    models:
      - opencode/deepseek-v4-flash-free
      - opencode/nemotron-3-ultra-free
      - opencode/laguna-s-2.1-free
      - opencode/ling-3.0-tiny-free
      - opencode/mimo-v2.5-free
    override_env: ORCH_FREE_MODELS
    best_for:
      - never_stop_free_fallback
      - cheap_analysis
      - second_opinion
      - log_summary
    forbidden_data:
      - secrets
      - env_files
      - service_role
      - raw_documents
      - pii

  public_data_scout_pool:
    transport: cli
    wrapper: scripts/orchestrator/run-free-pool.sh
    authority: read-only
    data_class: official_public_sources_only
    parallelism: bounded_per_portal
    output: manifest_or_handoff_only
    forbidden_actions:
      - worktree_write
      - git_commit
      - git_push
      - supabase_write
      - cloudflare_deploy
    best_for:
      - official_portal_reconnaissance
      - pagination_and_endpoint_discovery
      - source_hash_collection
      - coverage_gap_inventory

  google_antigravity:
    transport: cli
    wrapper: scripts/orchestrator/run-antigravity.sh
    auth: google_ai_pro_subscription
    model: google-gemini-1.5-pro (via agy read-only, snapshot git archive HEAD)
    authority: read-only_sandboxed
    best_for:
      - large_context
      - repository_mapping
      - documentation_synthesis
      - broad_comparison
      - research_plan
    data_scope:
      - public_repo_snapshot_only
      - never_raw_documents_or_secrets

  gemini_legacy:
    transport: cli
    wrapper: scripts/orchestrator/run-gemini.sh
    auth: api_key_or_enterprise_only
    authority: read-only
    enabled_when: explicitly_configured
    best_for:
      - compatibility

  codex:
    transport: mcp_stdio
    server: codex
    command: codex mcp-server
    authority: read-only_or_workspace_write_when_authorized
    models:
      cheap: gpt-5.6-luna
      normal: gpt-5.6-terra
      hard: gpt-5.6-sol
    best_for:
      - implementation
      - debugging
      - tests
      - refactoring
      - final_technical_review

  codex_exec_fallback:
    transport: cli
    wrapper: scripts/orchestrator/run-codex-readonly.sh
    model: gpt-5.6-luna
    authority: read-only
    enabled_when: codex_mcp_unavailable

  local_fallback:
    transport: codex_oss_cli
    wrapper: scripts/orchestrator/run-local-fallback.sh
    provider: ollama
    model: gpt-oss:20b
    authority: read-only
    enabled_when: doctor_confirms_available

routes:
  public_data_reconnaissance:
    - public_data_scout_pool
    - opencode_free_pool
    - google_antigravity
    - codex_exec_fallback
    - local_fallback

  cheap_analysis:
    - opencode_free
    - opencode_free_pool
    - google_antigravity
    - codex_exec_fallback
    - local_fallback

  large_context:
    - google_antigravity
    - opencode_free_pool
    - opencode_free
    - codex_exec_fallback
    - local_fallback

  simple_public_repo_task:
    - opencode_free
    - opencode_free_pool
    - google_antigravity
    - codex_exec_fallback
    - local_fallback

  code_change:
    - codex

  difficult_debug:
    - codex

  critical_change:
    - codex

codex_escalation:
  start: gpt-5.6-luna
  escalate_to_terra_when:
    - luna_result_incomplete
    - multi_file_implementation
    - tests_still_failing
    - material_uncertainty
  escalate_to_sol_when:
    - terra_result_incomplete
    - architecture_high_impact
    - difficult_regression
    - security_critical_reasoning
  on_model_change: new_thread_with_compact_handoff

fallback_rules:
  - on: [free_model_unavailable, free_model_rate_limited, free_model_quota_exhausted]
    action: continue_inside_opencode_free_pool_before_trying_paid_or_codex_routes
  - on: [rate_limit, quota_exhausted, timeout, auth_error, provider_down]
    action: mark_circuit_open_and_try_next_eligible_executor
  - on: mutation_executor_unavailable
    action: keep_writer_blocked_and_continue_read_only_reconnaissance_and_handoff
  - on: two_model_disagreement_on_sensitive_change
    action: human_review
  - on: remote_supabase_or_cloudflare_or_deploy
    action: execute_only_after_identity_gate_and_current_user_authorization_else_continue_read_only_reconnaissance
  - on: item_blocked_by_identity_source_or_fk
    action: keep_item_fail_closed_and_start_next_independent_local_or_read_only_chunk
  - on: gate_green
    action: document_publish_verify_and_select_next_eligible_chunk_without_prompt
  - on: process_exit_or_session_end
    action: durable_scheduler_reloads_state_and_resumes_next_chunk
  - on: reconnaissance_blocked
    action: keep_recon_queue_and_start_independent_local_implementation_or_release_verification

context:
  stable:
    - AGENTS.md
    - README.md
    - docs/context-export/SCHEMA.md
  operational:
    - .orchestrator/STATE.md
  per_task:
    - .orchestrator/templates/TASK_PACKET.md
  executor_return_schema:
    - .orchestrator/schemas/executor-result.schema.json
